<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>SquishBots · 3D avatar studio</title><link rel="stylesheet" href="/styles.css"><script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script><script>try{document.documentElement.dataset.theme=localStorage.getItem('squish-theme')||'dark'}catch{}</script></head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Edit this SquishBot" title="Edit this SquishBot"><span class="brand-mark" id="brand-avatar" aria-hidden="true"><img class="brand-fallback" src="/renders/round.png" alt=""></span> SquishBots <span class="brand-label">3D</span></a><nav><button id="theme-toggle" class="icon-button" aria-label="Switch to dark mode" title="Switch theme">◐</button></nav></header>
<main class="editor">
<section class="workspace" aria-label="Avatar preview and configuration">
<div class="workspace-heading"><div class="seed-row"><label class="sr-only" for="seed">Avatar seed</label><span class="seed-symbol">#</span><input id="seed" type="text" value="" autocomplete="off" spellcheck="false" placeholder="A name, a word, anything"><button id="shuffle" class="shuffle-button" title="Shuffle all unlocked settings"><span aria-hidden="true">⤨</span> Shuffle all</button></div><div class="preview-options"><label for="interaction-mode" class="sr-only">Drag mode</label><select id="interaction-mode" aria-label="Drag mode"><option value="rotate" selected>Rotate</option><option value="play">Play</option></select><button id="reset-view" title="Reset avatar rotation" aria-label="Reset view">Reset view</button><label class="check-label"><input id="gaze-visible" type="checkbox" checked> Follow pointer</label><label for="motion">Motion</label><select id="motion"><option value="none">Off</option><option value="hover" selected>On hover</option><option value="always">Always</option></select></div></div>

<div id="preview" class="preview" role="button" tabindex="0" aria-label="3D avatar. Click to react."><span class="loading-label" id="preview-loading">Preparing your avatar…</span></div>
<div class="reaction-controls" hidden><div class="reaction-toolbar"><label for="expression-main">Expression</label><select id="expression-main" aria-label="Avatar expression"></select><label class="check-label"><input id="gaze-toggle" type="checkbox" checked> Eyes follow pointer</label></div><div id="expression-shortcuts" class="expression-shortcuts" aria-label="Quick expressions"></div></div>
<p class="interaction-cue">Drag to rotate. Switch to Play to move and bounce.</p><div class="preview-caption"><span id="shape-caption">Live 3D preview</span><span class="preview-dot"></span><span>Blender render on export</span></div>

<div class="export-row"><div class="export-settings"><label for="export-format" class="sr-only">Export format</label><select id="export-format" aria-label="Export format"><option value="png">PNG · Blender</option><option value="gif">GIF · Preview</option><option value="mp4">MP4 · Preview</option><option value="webm">WebM · Preview</option></select><label for="export-size" id="export-size-label">Size</label><select id="export-size"><option value="512">512 px</option><option value="768" selected>768 px</option><option value="1024">1024 px</option><option value="2048">2048 px</option></select><label class="check-label"><input type="checkbox" id="transparent" checked> Transparent</label></div><button id="render-button" class="primary-button">Export PNG <span aria-hidden="true">↗</span></button></div>
<p id="animation-note" class="animation-note" hidden>4-second preview animation · Opaque background</p>
<div id="render-result" class="render-result" hidden></div><p id="app-status" class="app-status" role="status" aria-live="polite"></p>

</section>
<aside class="inspector" aria-label="Customize avatar"><div class="inspector-heading"><span>Customize</span><button id="reset-all">Reset all ↺</button></div><div id="controls"><p class="controls-loading">Loading controls…</p></div></aside>
</main><footer class="credits-footer"><p class="footer-credits">Avatar engine: <a href="https://github.com/Alain00/blobatar" target="_blank" rel="noreferrer">Blobatar by Alain</a> <span>·</span> Interaction inspiration: <a href="https://github.com/jeremy-prt/bloub" target="_blank" rel="noreferrer">Bloub by Jeremy</a></p></footer>
<script type="module" src="/app.js"></script>
</body></html>
